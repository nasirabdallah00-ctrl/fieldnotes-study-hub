<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#174c3a" />
    <meta name="description" content="An offline-ready study hub for WAEC, NPSE, and BECE revision." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <title>Exams Hub | Exam preparation</title>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Main navigation">
        <a class="brand" href="#dashboard" aria-label="Exams Hub home">
          <span class="brand-mark" aria-hidden="true">F</span>
          <span class="brand-name">Exams Hub</span>
        </a>
        <div class="sidebar-label">STUDY SPACE</div>
        <nav class="nav-list">
          <button class="nav-item is-active" data-view="dashboard"><span class="nav-glyph">⌂</span>Overview</button>
          <button class="nav-item" data-view="subjects"><span class="nav-glyph">▤</span>Subjects</button>
          <button class="nav-item" data-view="practice"><span class="nav-glyph">✳</span>Quick practice</button>
          <button class="nav-item" data-view="papers"><span class="nav-glyph">▧</span>Past papers</button>
          <button class="nav-item" data-view="notes"><span class="nav-glyph">✎</span>My notes</button>
        </nav>
        <div class="sidebar-bottom">
          <div class="offline-card">
            <span class="offline-dot" aria-hidden="true"></span>
            <div><strong id="offline-label">Ready to study</strong><span id="connection-label">Checking connection</span></div>
          </div>
          <div class="profile-row"><span class="avatar">S</span><span><strong>My study space</strong><small>Progress stays on this device</small></span></div>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div class="breadcrumb"><span>Study space</span><span class="breadcrumb-slash">/</span><strong id="page-title">Overview</strong></div>
          <label class="exam-picker"><span>PREPARING FOR</span><select id="exam-select" aria-label="Choose exam"><option value="WAEC">WAEC</option><option value="NPSE">NPSE</option><option value="BECE">BECE</option></select><span class="select-chevron" aria-hidden="true">⌄</span></label>
        </header>
        <div id="view-root" class="view-root" aria-live="polite"></div>
        <footer class="footer"><span>EXAMS HUB</span><span>Made for focused learning, online or off.</span><a class="asset-credit" href="https://commons.wikimedia.org/wiki/File:Coat_of_arms_of_Sierra_Leone.svg" target="_blank" rel="noreferrer">Coat of arms by Yuma et al. · CC BY-SA 3.0</a></footer>
      </main>
    </div>
    <script src="app.js" defer></script>
  </body>
</html>
